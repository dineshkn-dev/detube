version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'chore(deps)'
    groups:
      # Keep the noise down: one PR for all dev tooling bumps.
      dev-dependencies:
        dependency-type: development
        patterns: ['*']
        update-types: ['minor', 'patch']
    ignore:
      # Blocked upstream: typescript-eslint 8 peer-pins `typescript >=4.8.4 <6.1.0`,
      # so a TypeScript major cannot be installed until the lint plugin supports it.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
      # jsdom 30 pulls undici, which calls `webidl.util.markAsUncloneable` — absent
      # from Node 20. Revisit together with the minimum Node version in package.json.
      - dependency-name: jsdom
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: 'ci(deps)'
