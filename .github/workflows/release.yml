name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to publish a release for
        required: true

# `contents: write` is required to create the release.
permissions:
  contents: write

jobs:
  release:
    name: Package and publish
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.x'
          cache: npm

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Verify
        run: npm run verify

      - name: Package the extension
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          cd dist
          zip -r "../detube-${TAG}.zip" .
          cd ..
          # Fail loudly if the archive is missing, rather than publishing nothing.
          ls -l "detube-${TAG}.zip"

      # Uses the runner's preinstalled GitHub CLI instead of a third-party release
      # action, to keep the supply-chain surface of this project as small as possible.
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          gh release create "${TAG}" "detube-${TAG}.zip" \
            --title "${TAG}" \
            --generate-notes
